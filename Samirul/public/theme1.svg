<svg viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <radialGradient id="bgGrad" cx="15%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#2B5B39"/>
      <stop offset="45%" stop-color="#17351F"/>
      <stop offset="100%" stop-color="#12271B"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF4BD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF4BD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="720" height="900" fill="url(#bgGrad)"/>

  <!-- sun glow -->
  <circle cx="590" cy="140" r="110" fill="url(#sunGlow)"/>

  <!-- field waves at bottom -->
  <path d="M-20,760 C100,715 180,800 300,755 C420,715 500,800 640,760 L740,900 L-20,900 Z" fill="#3F8254" opacity="0.55"/>
  <path d="M-20,800 C130,760 210,835 330,795 C450,760 540,835 740,800 L740,900 L-20,900 Z" fill="#2E8B4F" opacity="0.55"/>
  <path d="M-20,845 C120,815 220,865 330,838 C440,815 540,865 740,845 L740,900 L-20,900 Z" fill="#1E5C36" opacity="0.9"/>

  <!-- leaves -->
  <text x="80" y="220" font-size="26" opacity="0.85">🌿</text>
  <text x="640" y="470" font-size="22" opacity="0.85">🌾</text>
  <text x="140" y="640" font-size="20" opacity="0.85">🌱</text>

  <!-- ================= LOGO ================= -->
  <rect x="40" y="40" width="44" height="44" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
  <text x="62" y="69" font-size="20" text-anchor="middle">🌿</text>

  <text x="96" y="62" font-size="20" font-weight="700" fill="#FFFFFF">Gram<tspan fill="#8FD96B">Niti</tspan></text>
  <text x="96" y="80" font-size="11" fill="rgba(255,255,255,0.65)">Empowering Rural Entrepreneurs</text>

  <!-- ================= HERO TEXT ================= -->
  <text x="40" y="160" font-size="32" font-weight="700" fill="#FFFFFF">Smart Decisions.</text>
  <text x="40" y="198" font-size="32" font-weight="700" fill="#FFFFFF">Stronger Businesses.</text>
  <text x="40" y="236" font-size="32" font-weight="700" fill="#8FD96B">Better Future.</text>

  <text x="40" y="270" font-size="14" fill="rgba(255,255,255,0.72)">GramNiti helps you analyse, plan and grow your business</text>
  <text x="40" y="290" font-size="14" fill="rgba(255,255,255,0.72)">with AI-powered insights and government scheme support.</text>

  <!-- ================= FEATURE LIST ================= -->
  <!-- 1 -->
  <rect x="40" y="330" width="38" height="38" rx="10" fill="rgba(143,217,107,0.16)"/>
  <text x="59" y="355" font-size="16" text-anchor="middle">📊</text>
  <text x="92" y="345" font-size="15" font-weight="700" fill="#FFFFFF">AI-Powered Analysis</text>
  <text x="92" y="364" font-size="12.5" fill="rgba(255,255,255,0.62)">Get an in-depth feasibility score for your business idea.</text>

  <!-- 2 -->
  <rect x="40" y="392" width="38" height="38" rx="10" fill="rgba(143,217,107,0.16)"/>
  <text x="59" y="417" font-size="16" text-anchor="middle">🏛️</text>
  <text x="92" y="407" font-size="15" font-weight="700" fill="#FFFFFF">Government Schemes</text>
  <text x="92" y="426" font-size="12.5" fill="rgba(255,255,255,0.62)">Find and apply for schemes that match your profile.</text>

  <!-- 3 -->
  <rect x="40" y="454" width="38" height="38" rx="10" fill="rgba(143,217,107,0.16)"/>
  <text x="59" y="479" font-size="16" text-anchor="middle">📈</text>
  <text x="92" y="469" font-size="15" font-weight="700" fill="#FFFFFF">Financial Planning</text>
  <text x="92" y="488" font-size="12.5" fill="rgba(255,255,255,0.62)">Plan investments, loans and forecast profits easily.</text>

  <!-- 4 -->
  <rect x="40" y="516" width="38" height="38" rx="10" fill="rgba(143,217,107,0.16)"/>
  <text x="59" y="541" font-size="16" text-anchor="middle">💬</text>
  <text x="92" y="531" font-size="15" font-weight="700" fill="#FFFFFF">AI Assistant</text>
  <text x="92" y="550" font-size="12.5" fill="rgba(255,255,255,0.62)">Ask questions and get expert answers anytime.</text>

  <!-- ================= TRUST BAR ================= -->
  <rect x="0" y="820" width="720" height="80" fill="rgba(0,0,0,0.28)"/>
  <line x1="0" y1="820" x2="720" y2="820" stroke="rgba(255,255,255,0.1)"/>

  <text x="40" y="856" font-size="16">🛡️</text>
  <text x="66" y="861" font-size="13" font-weight="600" fill="rgba(255,255,255,0.88)">100% Secure</text>

  <text x="230" y="856" font-size="16">🔒</text>
  <text x="256" y="855" font-size="13" font-weight="600" fill="rgba(255,255,255,0.88)">Your data is safe</text>
  <text x="256" y="871" font-size="13" font-weight="600" fill="rgba(255,255,255,0.88)">with us</text>

  <text x="440" y="856" font-size="16">✅</text>
  <text x="466" y="855" font-size="13" font-weight="600" fill="rgba(255,255,255,0.88)">Government</text>
  <text x="466" y="871" font-size="13" font-weight="600" fill="rgba(255,255,255,0.88)">Verified Schemes</text>

</svg>
