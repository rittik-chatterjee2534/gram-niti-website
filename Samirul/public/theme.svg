<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- background -->
  <rect width="1000" height="640" fill="#F7FBF6"/>

  <!-- Title -->
  <text x="40" y="55" font-size="26" font-weight="700" fill="#16231C">GramNiti — Theme</text>
  <text x="40" y="80" font-size="13" fill="#5C6B62">Rural-tech green palette · Sora + Inter type · component styles</text>

  <!-- ================= COLOR PALETTE ================= -->
  <text x="40" y="125" font-size="13" font-weight="700" fill="#5C6B62" letter-spacing="1">COLOR PALETTE</text>

  <!-- swatch template: rect + hex + name -->
  <g>
    <rect x="40" y="140" width="130" height="90" rx="12" fill="#12271B"/>
    <text x="45" y="248" font-size="12" font-weight="700" fill="#16231C">Forest 900</text>
    <text x="45" y="264" font-size="11" fill="#5C6B62">#12271B</text>
  </g>

  <g>
    <rect x="185" y="140" width="130" height="90" rx="12" fill="#1F4C2C"/>
    <text x="190" y="248" font-size="12" font-weight="700" fill="#16231C">Forest 700</text>
    <text x="190" y="264" font-size="11" fill="#5C6B62">#1F4C2C</text>
  </g>

  <g>
    <rect x="330" y="140" width="130" height="90" rx="12" fill="#2E8B4F"/>
    <text x="335" y="248" font-size="12" font-weight="700" fill="#16231C">Green 600 (primary)</text>
    <text x="335" y="264" font-size="11" fill="#5C6B62">#2E8B4F</text>
  </g>

  <g>
    <rect x="475" y="140" width="130" height="90" rx="12" fill="#3CA560"/>
    <text x="480" y="248" font-size="12" font-weight="700" fill="#16231C">Green 500</text>
    <text x="480" y="264" font-size="11" fill="#5C6B62">#3CA560</text>
  </g>

  <g>
    <rect x="620" y="140" width="130" height="90" rx="12" fill="#8FD96B" stroke="#E4ECE6"/>
    <text x="625" y="248" font-size="12" font-weight="700" fill="#16231C">Lime 400 (accent)</text>
    <text x="625" y="264" font-size="11" fill="#5C6B62">#8FD96B</text>
  </g>

  <g>
    <rect x="765" y="140" width="90" height="90" rx="12" fill="#FFFFFF" stroke="#E4ECE6" stroke-width="1.5"/>
    <text x="770" y="248" font-size="12" font-weight="700" fill="#16231C">White</text>
    <text x="770" y="264" font-size="11" fill="#5C6B62">#FFFFFF</text>
  </g>

  <g>
    <rect x="865" y="140" width="95" height="90" rx="12" fill="#F7FBF6" stroke="#E4ECE6" stroke-width="1.5"/>
    <text x="870" y="248" font-size="12" font-weight="700" fill="#16231C">Cream BG</text>
    <text x="870" y="264" font-size="11" fill="#5C6B62">#F7FBF6</text>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <text x="40" y="310" font-size="13" font-weight="700" fill="#5C6B62" letter-spacing="1">TYPOGRAPHY</text>

  <text x="40" y="355" font-size="34" font-weight="700" fill="#16231C">Smart Decisions.</text>
  <text x="40" y="378" font-size="12" fill="#5C6B62">Sora · Bold 700 · Display / Headings</text>

  <text x="40" y="415" font-size="16" font-weight="400" fill="#16231C">GramNiti helps you analyse, plan and grow your business.</text>
  <text x="40" y="435" font-size="12" fill="#5C6B62">Inter · Regular/Medium · Body &amp; UI text</text>

  <!-- ================= COMPONENTS ================= -->
  <text x="40" y="480" font-size="13" font-weight="700" fill="#5C6B62" letter-spacing="1">CORE COMPONENTS</text>

  <!-- Logo chip -->
  <g>
    <rect x="40" y="500" width="44" height="44" rx="12" fill="#12271B"/>
    <text x="55" y="529" font-size="20">🌿</text>
    <text x="95" y="518" font-size="16" font-weight="700" fill="#16231C">Gram<tspan fill="#2E8B4F">Niti</tspan></text>
    <text x="95" y="536" font-size="11" fill="#5C6B62">Logo lockup</text>
  </g>

  <!-- Primary button -->
  <g>
    <rect x="260" y="500" width="150" height="44" rx="12" fill="#2E8B4F"/>
    <text x="335" y="527" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Login</text>
  </g>
  <text x="260" y="562" font-size="11" fill="#5C6B62">Primary button</text>

  <!-- Input field -->
  <g>
    <rect x="440" y="500" width="200" height="44" rx="12" fill="#FAFCFA" stroke="#E4ECE6" stroke-width="1.5"/>
    <text x="456" y="527" font-size="13" fill="#8B978F">Enter your email</text>
  </g>
  <text x="440" y="562" font-size="11" fill="#5C6B62">Input field</text>

  <!-- Feature icon chip -->
  <g>
    <rect x="670" y="500" width="44" height="44" rx="10" fill="#DDF2E1"/>
    <text x="682" y="528" font-size="18">📊</text>
  </g>
  <text x="670" y="562" font-size="11" fill="#5C6B62">Feature icon chip</text>

  <!-- Trust badge -->
  <g>
    <rect x="750" y="500" width="210" height="44" rx="10" fill="#12271B"/>
    <text x="765" y="527" font-size="12" fill="#FFFFFF">🛡️  100% Secure</text>
  </g>
  <text x="750" y="562" font-size="11" fill="#5C6B62">Trust bar item</text>

  <!-- footer line -->
  <line x1="40" y1="595" x2="960" y2="595" stroke="#E4ECE6"/>
  <text x="40" y="618" font-size="11" fill="#8B978F">GramNiti design theme · green, grounded, trustworthy — built for rural business confidence</text>

</svg>
